[workspace]
resolver = "2"
members = ["."]

[workspace.lints.clippy]
shadow_same = "warn"
shadow_reuse = "warn"
shadow_unrelated = "warn"
type_complexity = "allow"

[package]
name = "multipaz-longfellow-ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "zkp"
crate-type = ["cdylib", "staticlib"]

[dependencies]
mdoc-zk-runtime = { git = "https://github.com/sissyp/longfellow-zk.git", rev = "52439cece7392751b812782bab231e1ca80bc694" }
runtime-random = { git = "https://github.com/sissyp/longfellow-zk.git", rev = "52439cece7392751b812782bab231e1ca80bc694" }
libc = "0.2"
zstd = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
